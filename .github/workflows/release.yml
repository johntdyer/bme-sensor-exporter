name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Version, Build, and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race ./...

      - name: Determine next version
        id: version
        run: |
          # Get the latest semver tag; default to v0.0.0 if none exists
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: ${LATEST_TAG}"

          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          # Collect commit subjects since the last tag.
          # If LATEST_TAG doesn't exist in the repo (e.g. v0.0.0 default), fall back to all commits.
          if git rev-parse "${LATEST_TAG}" >/dev/null 2>&1; then
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s")
          else
            COMMITS=$(git log --pretty=format:"%s")
          fi

          # Bump rules (Conventional Commits):
          #   BREAKING CHANGE or <type>!:  -> major
          #   feat:                        -> minor
          #   anything else                -> patch
          if echo "$COMMITS" | grep -qE "^(feat|fix|refactor|perf|chore)(\(.+\))?!:|^BREAKING CHANGE"; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Next version: ${NEW_TAG}"
          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist

          GOOS=linux GOARCH=arm GOARM=7 go build \
            -trimpath \
            -ldflags "-s -w" \
            -o "dist/bme-sensor-exporter-${TAG}-linux-armv7" \
            .

          GOOS=linux GOARCH=arm64 go build \
            -trimpath \
            -ldflags "-s -w" \
            -o "dist/bme-sensor-exporter-${TAG}-linux-arm64" \
            .

          sha256sum dist/bme-sensor-exporter-* > dist/checksums.txt

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --title "Release ${TAG}" \
            --generate-notes \
            dist/bme-sensor-exporter-${TAG}-linux-armv7 \
            dist/bme-sensor-exporter-${TAG}-linux-arm64 \
            dist/checksums.txt
