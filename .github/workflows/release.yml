name: Release

on:
  push:
    branches:
      - master

jobs:
  release:
    name: Version, Build, and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race ./...

      - name: Determine next version
        id: version
        run: |
          # Get the latest semver tag, default to v0.0.0 if none exists
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: ${LATEST_TAG}"

          VERSION=${LATEST_TAG#v}
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          # Collect commit messages since the last tag
          COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")

          # Determine bump level using conventional commits:
          #   BREAKING CHANGE or feat!: -> major
          #   feat:                     -> minor
          #   fix: / chore: / etc.      -> patch
          if echo "$COMMITS" | grep -qE "^(feat|fix|refactor|perf|chore)(\(.+\))?!:|^BREAKING CHANGE"; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Next version: ${NEW_TAG}"
          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        run: |
          mkdir -p dist
          TAG=${{ steps.version.outputs.tag }}

          GOOS=linux GOARCH=arm GOARM=7 go build \
            -trimpath \
            -ldflags "-s -w" \
            -o "dist/bme-sensor-exporter-${TAG}-linux-armv7" \
            .

          GOOS=linux GOARCH=arm64 go build \
            -trimpath \
            -ldflags "-s -w" \
            -o "dist/bme-sensor-exporter-${TAG}-linux-arm64" \
            .

          cd dist && sha256sum ./* > checksums.txt

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/bme-sensor-exporter-${{ steps.version.outputs.tag }}-linux-armv7
            dist/bme-sensor-exporter-${{ steps.version.outputs.tag }}-linux-arm64
            dist/checksums.txt
